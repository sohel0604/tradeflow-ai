# =============================================================================
# TradeFlow AI — Docker Compose
# Builds up day by day:
#   Day 3  → PostgreSQL only
#   Day 4  → + MongoDB + Redis
#   Day 5  → + Nginx
#   Day 7  → + Backend + Celery Worker + Celery Beat + Flower
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # FastAPI Backend — the main API server
  # Handles: REST API, WebSocket, health check
  # Hot-reload is ON (--reload) so code changes apply without rebuild
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeflow_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Mount source code so --reload picks up changes instantly
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradeflow_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------------------------------------------------------------------------
  # Celery Worker — runs background tasks
  # Picks tasks off the Redis queue and executes them
  # concurrency = number of tasks it can run at the same time
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeflow_celery_worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradeflow_net
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 -Q default,pipeline,signals,alerts

  # ---------------------------------------------------------------------------
  # Celery Beat — the scheduler
  # Triggers tasks on a schedule (like cron)
  # Fires the daily pipeline at 06:00 IST every trading day
  # Only ONE beat instance should ever run — it's the clock
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeflow_celery_beat
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tradeflow_net
    command: celery -A app.celery_app beat --loglevel=info

  # ---------------------------------------------------------------------------
  # Flower — Celery task monitoring dashboard
  # See all tasks: PENDING, RUNNING, SUCCESS, FAILURE
  # Available at http://localhost:5555
  # ---------------------------------------------------------------------------
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeflow_flower
    restart: unless-stopped
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tradeflow_net
    command: celery -A app.celery_app flower --port=5555

  # ---------------------------------------------------------------------------
  # Nginx — Reverse Proxy
  # The only service exposed to the outside world on port 80
  # Routes all traffic to the correct internal service
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: tradeflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tradeflow_net

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 — Primary relational database
  # Stores: users, price_bars, signals, backtest_results, watchlists, billing
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: tradeflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradeflow}
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeflow123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeflow} -d ${POSTGRES_DB:-tradeflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tradeflow_net

  # ---------------------------------------------------------------------------
  # MongoDB 7 — Document database
  # Stores: indicators, chart_patterns, backtest_trade_logs, ai_conversations
  # Why MongoDB for these? They are nested JSON documents, not flat rows.
  # A price bar is a flat row → PostgreSQL
  # An indicator snapshot is a nested JSON doc → MongoDB
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7-jammy
    container_name: tradeflow_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-tradeflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-tradeflow123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-tradeflow}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tradeflow_net

  # ---------------------------------------------------------------------------
  # Redis 7 — In-memory store (3 jobs in one)
  # Job 1: Celery broker  → task queue (pipeline tasks wait here)
  # Job 2: Celery backend → task results are stored here
  # Job 3: Cache          → API responses cached here (fast reads)
  # Job 4: Pub/Sub        → WebSocket signal fan-out (Day 92)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tradeflow_redis
    restart: unless-stopped
    # requirepass sets a password — Redis is open by default, always protect it
    command: redis-server --requirepass ${REDIS_PASSWORD:-tradeflow123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-tradeflow123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tradeflow_net

# =============================================================================
# Volumes — persistent data storage
# Named volumes survive container restarts and removals
# Use "docker compose down -v" to delete ALL data (fresh start)
# =============================================================================
volumes:
  postgres_data:
  mongo_data:
  redis_data:

# =============================================================================
# Networks — private network so services can talk to each other by name
# Example: backend connects to postgres using hostname "postgres" not localhost
# =============================================================================
networks:
  tradeflow_net:
    driver: bridge
