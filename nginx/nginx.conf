# =============================================================================
# TradeFlow AI — Nginx Configuration
#
# Nginx sits in front of everything and routes requests:
#   /api/*      → FastAPI backend (port 8000)
#   /ws/*       → WebSocket connections (FastAPI, port 8000)
#   /charts/*   → Static chart images (FastAPI)
#   /health     → Health check (FastAPI)
#   /           → React frontend (added Day 98)
#
# Why Nginx in front of FastAPI?
# - Handles SSL termination (HTTPS)
# - Serves static files efficiently
# - Load balances across multiple backend pods
# - Protects backend from direct internet exposure
# =============================================================================

upstream backend {
    # "backend" is the Docker service name — resolves inside Docker network
    # In production this would list multiple backend pods for load balancing
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # -------------------------------------------------------------------------
    # Gzip compression — shrinks response size by 60-80%
    # Smaller responses = faster page loads for users
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        text/javascript;

    # -------------------------------------------------------------------------
    # API routes → FastAPI backend
    # All requests starting with /api/ go to FastAPI
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;

        # Pass real client info to FastAPI
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — how long to wait for FastAPI to respond
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    300s;
    }

    # -------------------------------------------------------------------------
    # WebSocket routes → FastAPI WebSocket handler
    # WebSockets need special headers: Upgrade + Connection
    # proxy_read_timeout 3600s = keep connection alive for 1 hour
    # -------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://backend;

        # These two headers are REQUIRED for WebSocket to work
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long timeout — WebSocket connections stay open
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------------------------------------------------------------------------
    # Chart images — served by FastAPI static files
    # -------------------------------------------------------------------------
    location /charts/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;

        # Cache chart images in browser for 1 day
        expires 1d;
        add_header Cache-Control "public";
    }

    # -------------------------------------------------------------------------
    # Health check endpoint
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------------
    # Docs (Swagger UI) — only available in development
    # -------------------------------------------------------------------------
    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------------
    # Root — placeholder until React frontend is built (Day 98)
    # -------------------------------------------------------------------------
    location / {
        return 200 '{"service":"TradeFlow AI","status":"running","version":"1.0.0"}';
        add_header Content-Type application/json;
    }
}
