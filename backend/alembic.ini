# =============================================================================
# Alembic Configuration
# Day 13 — TradeFlow AI
#
# Alembic is a database migration tool for SQLAlchemy.
# It version-controls your schema changes — like Git for your database.
#
# Key commands:
#   alembic upgrade head          → apply all pending migrations
#   alembic downgrade -1          → undo the last migration
#   alembic revision --autogenerate -m "add column"  → generate new migration
#   alembic current               → show which migration is applied
#   alembic history               → show all migrations
# =============================================================================

[alembic]
# Where migration scripts live
script_location = alembic

# Prepend sys.path so imports from app/ work inside migrations
prepend_sys_path = .

# How revision files are named:  0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s

# database URL — overridden in env.py from settings, so this is just a fallback
sqlalchemy.url = postgresql://tradeflow:tradeflow123@postgres:5432/tradeflow

[post_write_hooks]
# No post-write hooks configured yet

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
